name: Pilot review evidence

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    name: Verify pilot review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify catalog and record result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_NUMBER" ]]; then
            python -B scripts/verify_pilot_review_evidence.py --revision "$GITHUB_SHA"
            exit
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$PR_HEAD" =~ ^[a-f0-9]{40}$ && "$PR_BASE" =~ ^[a-f0-9]{40}$ ]]
          status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD" \
              -f state="$1" -f context=steps/pilot-review-evidence \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          }
          status pending
          trap 'if (( $? != 0 )); then status failure; fi' EXIT
          # The merge commit supplies data only. The verifier is loaded from the base revision.
          git fetch --no-tags --depth=2 origin "refs/pull/$PR_NUMBER/merge"
          revision=$(git rev-parse FETCH_HEAD)
          [[ "$(git rev-parse "$revision^1")" == "$PR_BASE" ]]
          [[ "$(git rev-parse "$revision^2")" == "$PR_HEAD" ]]
          python -B scripts/verify_pilot_review_evidence.py --revision "$revision"
          status success
