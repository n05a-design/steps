name: Repository configuration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/validate_github_config.py"
      - ".github/workflows/repository-config.yml"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/validate_github_config.py"
      - ".github/workflows/repository-config.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the audit YAML parser
        run: python -m pip install -r knowledge/benchmark/requirements.txt
      - name: Validate GitHub YAML configuration and issue forms
        run: python -B scripts/validate_github_config.py
