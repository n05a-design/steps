name: Secret Scanning Guardrail

on:
  push:
    branches: [ main, chore/**, feat/**, fix/**, security/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run shared fail-closed secret scanner
        run: python3 -B scripts/pre-commit-secret-check.py --scan-all
