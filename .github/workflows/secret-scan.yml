name: Secret Scanning Guardrail

on:
  push:
    branches: [ main, chore/**, feat/**, fix/**, security/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Hardened Secret Regex Scan
        run: |
          echo "Scanning repository files for exposed API key patterns (Hardened Fail-Closed)..."
          python3 -c "
          import os, re, sys

          PATTERNS = [
              (r'AIzaSy[A-Za-z0-9_-]{33}', 'Google Cloud / Firebase API Key'),
              (r'AKIA[0-9A-Z]{16}', 'AWS Access Key ID'),
              (r'ghp_[A-Za-z0-9_]{36}', 'GitHub Personal Access Token'),
              (r'-----BEGIN [A-Z]+ PRIVATE KEY-----', 'Private Key Header')
          ]

          # Strict path-based fixture exemptions: ONLY authorized test fixtures
          EXEMPT_FILES = {
              'tests/test_secret_scanner.py',
              'tests/fixtures/synthetic_secrets.json'
          }

          def normalize_path(path_str):
              return path_str.replace('\\\\', '/').strip('./')

          found = 0
          errors = 0

          for root, dirs, files in os.walk('.'):
              norm_root = normalize_path(root)
              if '.git' in norm_root or 'Auditpakete' in norm_root or 'StepsAudit' in norm_root:
                  continue
              for f in files:
                  if f.endswith(('.download', '.html', '.js', '.py', '.md', '.json', '.yaml', '.yml', '.csv', '.sh', '.ps1')):
                      fp = os.path.join(root, f)
                      norm_fp = normalize_path(fp)
                      if norm_fp in EXEMPT_FILES:
                          continue
                      try:
                          with open(fp, 'r', encoding='utf-8', errors='replace') as fh:
                              for i, line in enumerate(fh, 1):
                                  for pat, desc in PATTERNS:
                                      if re.search(pat, line):
                                          print(f'::error file={norm_fp},line={i}::Exposed secret pattern detected: {desc}')
                                          found += 1
                      except Exception as e:
                          print(f'::error file={norm_fp}::Failed to read file for secret scanning: {e}')
                          errors += 1

          if errors > 0:
              print(f'FAILURE: {errors} file read errors encountered during scan (Fail-Closed).')
              sys.exit(1)

          if found > 0:
              print(f'FAILURE: {found} exposed secret pattern(s) detected!')
              sys.exit(1)

          print('SUCCESS: Zero unmasked secrets detected across all scanned repository files.')
          "
