name: Secret Scanning Guardrail

on:
  push:
    branches: [ main, chore/**, feat/**, fix/**, security/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Hardened Secret Regex Scan
        run: |
          echo "Scanning repository files for exposed API key patterns (Hardened Fail-Closed with Historical Baseline)..."
          python3 -c "
          import os, re, sys, json, hashlib

          PATTERNS = [
              (r'AIzaSy[A-Za-z0-9_-]{33}', 'Google Cloud / Firebase API Key'),
              (r'AKIA[0-9A-Z]{16}', 'AWS Access Key ID'),
              (r'ghp_[A-Za-z0-9_]{36}', 'GitHub Personal Access Token'),
              (r'-----BEGIN [A-Z]+ PRIVATE KEY-----', 'Private Key Header')
          ]

          AUTHORIZED_SYNTHETIC_TEST_SECRETS = {
              'AIzaSy' + 'FakeSyntheticTestKeyForCI00000000',
              'AKIA' + 'IOSFODNN7EXAMPLE',
              'ghp_' + 'FakeSyntheticGitHubTokenForCI1234567'
          }

          TEST_FIXTURE_FILES = {
              'tests/test_secret_scanner.py',
              'tests/fixtures/synthetic_secrets.json'
          }

          def normalize_path(path_str):
              p = path_str.replace(chr(92), '/')
              while p.startswith('./') or p.startswith('/'):
                  if p.startswith('./'):
                      p = p[2:]
                  elif p.startswith('/'):
                      p = p[1:]
              return p

          # Load Quarantined Historical Baseline (Fail-Closed Enforcement)
          baseline_lookup = {}
          baseline_file = 'scripts/historical_secret_baseline.json'
          if not os.path.exists(baseline_file):
              print(f'FATAL: Required baseline file {baseline_file} missing (Fail-Closed)!', file=sys.stderr)
              sys.exit(1)

          try:
              with open(baseline_file, 'r', encoding='utf-8') as bf:
                  b_data = json.load(bf)
                  for item in b_data:
                      norm_p = normalize_path(item['file'])
                      key = (norm_p, item['line'], item['pattern_desc'])
                      baseline_lookup[key] = item['secret_sha256']
              print(f'Loaded {len(baseline_lookup)} quarantined historical baseline findings with SHA-256 bindings (OA-0033 / OA-0001).')
          except Exception as e:
              print(f'FATAL: Corrupted baseline file {baseline_file} (Fail-Closed): {e}', file=sys.stderr)
              sys.exit(1)

          new_leaks = 0
          quarantined_count = 0
          read_errors = 0

          # Exclude strictly .git, .venv, StepsAudit, and Auditpakete (.agents IS SCANNED)
          for root, dirs, files in os.walk('.'):
              norm_root = normalize_path(root)
              if '.git' in norm_root or 'Auditpakete' in norm_root or 'StepsAudit' in norm_root or '.venv' in norm_root:
                  continue
              for f in files:
                  if f.endswith(('.download', '.html', '.js', '.py', '.md', '.json', '.yaml', '.yml', '.csv', '.sh', '.ps1')):
                      fp = os.path.join(root, f)
                      norm_fp = normalize_path(fp)
                      if norm_fp == 'scripts/historical_secret_baseline.json':
                          continue
                      try:
                          with open(fp, 'r', encoding='utf-8', errors='replace') as fh:
                              for i, line in enumerate(fh, 1):
                                  for pat, desc in PATTERNS:
                                      m = re.search(pat, line)
                                      if m:
                                          secret_val = m.group(0)
                                          # Check authorized synthetic mock in test fixtures
                                          if norm_fp in TEST_FIXTURE_FILES and secret_val in AUTHORIZED_SYNTHETIC_TEST_SECRETS:
                                              continue

                                          # Check quarantined historical baseline with secret_sha256 binding
                                          sec_hash = hashlib.sha256(secret_val.encode('utf-8')).hexdigest()
                                          base_key = (norm_fp, i, desc)
                                          if base_key in baseline_lookup and baseline_lookup[base_key] == sec_hash:
                                              quarantined_count += 1
                                              continue

                                          # Unregistered / New exposed secret or tampered secret on baseline line!
                                          masked = secret_val[:6] + '...' + secret_val[-4:] if len(secret_val) > 10 else '***REDACTED***'
                                          print(f'::error file={norm_fp},line={i}::Exposed secret pattern detected: {desc} [{masked}]')
                                          new_leaks += 1
                      except Exception as e:
                          print(f'::error file={norm_fp}::Failed to read file for secret scanning (Fail-Closed): {e}')
                          read_errors += 1

          print('-----------------------------------------------------------------')
          print(f'Scan summary: {quarantined_count} quarantined historical findings (OA-0033/OA-0001), {new_leaks} new leaks, {read_errors} read errors.')

          if read_errors > 0:
              print(f'FAILURE: {read_errors} file read errors encountered during scan (Fail-Closed).')
              sys.exit(1)

          if new_leaks > 0:
              print(f'FAILURE: {new_leaks} exposed secret pattern(s) detected outside baseline!')
              sys.exit(1)

          print('SUCCESS: Zero unmasked secrets detected across all repository files.')
          sys.exit(0)
          "
