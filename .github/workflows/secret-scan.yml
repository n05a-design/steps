name: Secret Scanning Guardrail

on:
  push:
    branches: [ main, chore/**, feat/**, fix/**, security/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Regex Scan
        run: |
          echo "Scanning repository files for exposed API key patterns..."
          python3 -c "
          import os, re, sys
          PATTERNS = [
              r'AIzaSy[A-Za-z0-9_-]{33}',
              r'AKIA[0-9A-Z]{16}',
              r'ghp_[A-Za-z0-9_]{36}'
          ]
          found = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'Auditpakete' in root or 'StepsAudit' in root:
                  continue
              for f in files:
                  if f.endswith(('.download', '.html', '.js', '.py', '.md', '.json', '.yaml', '.csv')):
                      fp = os.path.join(root, f)
                      try:
                          with open(fp, 'r', encoding='utf-8', errors='ignore') as fh:
                              for i, line in enumerate(fh, 1):
                                  if 'SYNTHETIC_TEST' in line or 'REDACTED' in line:
                                      continue
                                  for pat in PATTERNS:
                                      if re.search(pat, line):
                                          print(f'::error file={fp},line={i}::Exposed secret pattern detected: {pat}')
                                          found += 1
                      except Exception:
                          pass
          if found > 0:
              print(f'FAILURE: {found} exposed secrets found!')
              sys.exit(1)
          print('SUCCESS: Zero unmasked secrets detected.')
          "
