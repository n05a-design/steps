name: Repository structure
on:
  push:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'docs/**'
      - 'knowledge/**'
      - 'schemas/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.agents/**'
      - '.github/workflows/structure-check.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'docs/**'
      - 'knowledge/**'
      - 'schemas/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.agents/**'
      - '.github/workflows/structure-check.yml'
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STEPS structure
        run: python -B tools/validation/check_structure.py
      - name: Run root test suite
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Run agent skill tests (if present)
        run: |
          if [ -d ".agents/skills/steps-knowledge-curation/tests" ]; then
            python -B -m unittest discover -s .agents/skills/steps-knowledge-curation/tests -v
          fi

