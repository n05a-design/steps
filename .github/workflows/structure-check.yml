name: Repository structure
on:
  push:
    paths: ['README.md', 'AGENTS.md', 'docs/**', 'knowledge/**', 'schemas/**', 'tools/**', 'tests/**', '.github/workflows/structure-check.yml']
  pull_request:
    paths: ['README.md', 'AGENTS.md', 'docs/**', 'knowledge/**', 'schemas/**', 'tools/**', 'tests/**', '.github/workflows/structure-check.yml']
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validation/check_structure.py
