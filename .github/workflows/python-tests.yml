name: Python Tests & Verification Suite

on:
  push:
    branches: [ main, feat/**, fix/**, chore/** ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '24 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Technical music audit profile
        type: choice
        options: [smoke, pr, nightly, full]
        default: full
      seed:
        description: Numeric audit seed
        type: string
        default: '20261121'
      case:
        description: Optional finite reference case ID
        type: string

permissions:
  contents: read

jobs:
  continuous-music-validation:
    name: Continuous music validation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run technical music validation
        env:
          AUDIT_PROFILE: ${{ inputs.profile || 'nightly' }}
          AUDIT_SEED: ${{ inputs.seed }}
          AUDIT_CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          python -B -O scripts/audit_randomized_music.py --self-test \
            --json-out "$RUNNER_TEMP/music-oracle-self-test.json"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            AUDIT_SEED="$(date -u +%Y%m%d)"
          fi
          args=(--profile "$AUDIT_PROFILE" --seed "$AUDIT_SEED" --timeout 120)
          if [[ -n "$AUDIT_CASE" ]]; then
            args+=(--case "$AUDIT_CASE")
          fi
          python -B scripts/audit_randomized_music.py "${args[@]}" \
            --json-out "$RUNNER_TEMP/musical-validation.json"
      - name: Install isolated stateful test dependencies
        if: github.event_name == 'schedule'
        run: |
          python -m venv "$RUNNER_TEMP/music-test-venv"
          "$RUNNER_TEMP/music-test-venv/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r scripts/music-audit-stateful-requirements.txt
      - name: Run stateful music and history tests
        if: github.event_name == 'schedule'
        env:
          HYPOTHESIS_STORAGE_DIRECTORY: ${{ runner.temp }}/music-hypothesis
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/music-test-venv/bin/python" -B -m unittest \
            tests.test_music_audit_stateful.HypothesisMusicAudit.test_keyboard_transitions \
            tests.test_music_audit_stateful.HypothesisMusicAudit.test_session_history \
            tests.test_music_audit_stateful.HypothesisMusicAudit.test_smf_vlq_decoder_against_independent_byte_model \
            tests.test_music_audit_stateful.HypothesisMusicAudit.test_smf_vlq_canonical_writer \
            tests.test_music_audit_stateful.KeyboardStateAudit \
            tests.test_music_audit_semantics \
            tests.test_music_audit_combinations -v 2>&1 | tee "$RUNNER_TEMP/music-stateful.log"
      - name: Run curated music mutations every Sunday
        if: github.event_name == 'schedule' && always()
        run: |
          if [[ "$(date -u +%u)" == 7 ]]; then
            python -B scripts/check_music_audit_mutations.py --generated-per-module 4 \
              --json-out "$RUNNER_TEMP/music-mutations.json"
          fi
      - name: Keep the continuous validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: continuous-music-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/music-oracle-self-test.json
            ${{ runner.temp }}/musical-validation.json
            ${{ runner.temp }}/music-stateful.log
            ${{ runner.temp }}/music-mutations.json
          if-no-files-found: error

  package-artifacts:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Python wheel artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build and inspect wheel
        run: python -B -m unittest tests.test_package_artifacts -v

  desktop-ui-smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Desktop UI smoke (Ubuntu/Xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install native Tk display support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Smoke-test native Tk window and core workflow
        env:
          STEPS_REQUIRE_DESKTOP_TK: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          xvfb-run -a python -B -m unittest \
            tests.test_desktop_app_entrypoint.TestDesktopAppEntrypoint.test_main_window_instantiation_and_wiring \
            tests.test_desktop_app_entrypoint.TestDesktopAppEntrypoint.test_native_dialog_workflow \
            -v

  desktop-ui-platform-smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Desktop UI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Aqua Tk shares native application state across interpreters in one process.
      - name: Smoke-test native Tk window and core workflow
        env:
          STEPS_REQUIRE_DESKTOP_TK: "1"
          PYTHONFAULTHANDLER: "1"
        run: >-
          python -B -m unittest
          tests.test_desktop_app_entrypoint.TestDesktopAppEntrypoint.test_main_window_instantiation_and_wiring
          -v

      - name: Smoke-test native dialog workflow in a fresh process
        env:
          STEPS_REQUIRE_DESKTOP_TK: "1"
          PYTHONFAULTHANDLER: "1"
        run: >-
          python -B -m unittest
          tests.test_desktop_app_entrypoint.TestDesktopAppEntrypoint.test_native_dialog_workflow
          -v

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Source-preservation regressions compare sanitized assets with their
          # immutable historical blobs without printing credential payloads.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install YAML validation parser
        run: python -m pip install --upgrade PyYAML

      - name: Check generated Golden Case fixture
        run: python -B scripts/build_unified_golden_cases.py --check

      - name: Check generated Python API reference
        run: python -B scripts/render_api_reference.py --check

      - name: Check documentation consistency policy
        run: python -B scripts/check_documentation_consistency.py --check

      - name: Check relative Markdown links
        run: python -B scripts/check_markdown_links.py --check

      - name: Check Gemini knowledge pack
        run: python -B scripts/check_gemini_knowledge_pack.py --check

      - name: Check active UI text localization inventory
        run: python -B scripts/check_ui_text_inventory.py --check

      - name: Check active CLI text localization inventory
        run: python -B scripts/check_cli_text_inventory.py --check

      - name: Check release and version consistency
        run: python -B scripts/check_release_consistency.py --check

      - name: Check randomized musical questions against independent oracles
        run: |
          python -B -O scripts/audit_randomized_music.py --self-test
          python -B scripts/audit_randomized_music.py --profile pr --timeout 90 \
            --json-out "$RUNNER_TEMP/musical-validation.json"

      - name: Keep the technical music validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: musical-validation-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/musical-validation.json
          if-no-files-found: error

      - name: Run STEPS Core Test Suite
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Knowledge Curation Skill Tests
        run: |
          if [ -d ".agents/skills/steps-knowledge-curation/tests" ]; then
            python -B -m unittest discover -s .agents/skills/steps-knowledge-curation/tests -v
          fi

  curation-platforms:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Curation skill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            .agents/skills/steps-knowledge-curation
            decisions
            docs/operations
            knowledge
            scripts
            tests/golden_cases
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the curation workflow and negative cases
        run: python -B -m unittest discover -s .agents/skills/steps-knowledge-curation/tests -v
      - name: Verify the canonical work register
        run: python -B .agents/skills/steps-knowledge-curation/scripts/validate_register.py
      - name: Verify musical references and curated evidence
        run: python -B .agents/skills/steps-knowledge-curation/scripts/check_reference_ids.py --json

  pilot-publication:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Pilot publication gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run mandatory pilot benchmark
        run: python -B scripts/run_knowledge_benchmark.py --scope pilot
      - name: Test production publication paths
        run: python -B scripts/run_knowledge_benchmark.py --scope publication
      - name: Check pilot review sheet
        run: python -B scripts/run_knowledge_benchmark.py --check-review-sheet knowledge/benchmark/PILOT_ABNAHME.md
      - name: Validate pilot approvals and published learning material
        run: python -B scripts/render_reviewed_progressions.py --check

  knowledge-coverage:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Knowledge coverage inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install audit-only YAML parser
        run: python -m pip install -r knowledge/benchmark/requirements.txt
      - name: Check versioned knowledge coverage
        run: python -B scripts/audit_knowledge_coverage.py --check
      - name: Check complete historical graph audit matrix
        run: python -B scripts/audit_graph.py --check
      - name: Check all remaining historical Golden reviews and source hashes
        run: python -B scripts/audit_golden_remaining.py --check
      - name: Check source-bound Golden conflict revisions
        run: python -B scripts/audit_conflict_revisions.py --check
      - name: Check all 58 graph follow-ups and versioned error identities
        run: python -B scripts/audit_graph_followup.py --check
      - name: Check scoped graph semantics and MIDI notation contracts
        run: python -B scripts/audit_graph_semantics.py --check

      - name: Check all 14 corpus cases and separated source evidence
        run: python -B scripts/audit_graph_corpus.py --check

      - name: Check partial Billboard and versioned EDM metadata observations
        run: |
          python -B scripts/audit_billboard_components.py --check
          python -B scripts/audit_edm_tempo.py --check

      - name: Check same-ID RWC component observations without accepting groove claims
        run: python -B scripts/audit_rwc_joint.py --check

      - name: Check Swing chart and original-drum source distinctions
        run: python -B scripts/audit_jazzsamba_components.py --check

      - name: Check bounded REL-001 and REL-005 pattern components
        run: python -B scripts/audit_relation_patterns.py --check

      - name: Check historical REF-0030 syncopation and timing sensitivity
        run: python -B scripts/audit_pattern_syncopation.py --check

      - name: Check publisher-mapped Swing drum components without harmonic approval
        run: python -B scripts/audit_gmd_swing.py --check

      - name: Check actual Ride intervals without acoustic dynamics approval
        run: python -B scripts/audit_gmd_swing_detail.py --check

      - name: Check source-bound Pop pattern interpretations without approval
        run: python -B scripts/audit_gmd_pop_pattern.py --check

      - name: Check source-bound Funk components without musical approval
        run: python -B scripts/audit_gmd_funk.py --check

      - name: Check explicit corpus label coverage and bounded Soul proxy
        run: python -B scripts/audit_gmd_coverage.py --check
