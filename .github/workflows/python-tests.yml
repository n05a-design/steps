name: Python Tests & Verification Suite

on:
  push:
    branches: [ main, feat/**, fix/**, chore/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Source-preservation regressions compare sanitized assets with their
          # immutable historical blobs without printing credential payloads.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check generated Golden Case fixture
        run: python -B scripts/build_unified_golden_cases.py --check

      - name: Check generated Python API reference
        run: python -B scripts/render_api_reference.py --check

      - name: Run STEPS Core Test Suite
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Knowledge Curation Skill Tests
        run: |
          if [ -d ".agents/skills/steps-knowledge-curation/tests" ]; then
            python -B -m unittest discover -s .agents/skills/steps-knowledge-curation/tests -v
          fi

  curation-platforms:
    name: Curation skill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .agents/skills/steps-knowledge-curation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test register recovery and source intake
        run: python -B -m unittest discover -s .agents/skills/steps-knowledge-curation/tests -v

  pilot-publication:
    name: Pilot publication gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mandatory pilot benchmark
        run: python -B scripts/run_knowledge_benchmark.py --scope pilot
      - name: Test production publication paths
        run: python -B scripts/run_knowledge_benchmark.py --scope publication
      - name: Check pilot review sheet
        run: python -B scripts/run_knowledge_benchmark.py --check-review-sheet knowledge/benchmark/PILOT_ABNAHME.md
      - name: Validate pilot approvals and published learning material
        run: python -B scripts/render_reviewed_progressions.py --check

  knowledge-coverage:
    name: Knowledge coverage inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit-only YAML parser
        run: python -m pip install -r knowledge/benchmark/requirements.txt
      - name: Check versioned knowledge coverage
        run: python -B scripts/audit_knowledge_coverage.py --check
      - name: Check complete historical graph audit matrix
        run: python -B scripts/audit_graph.py --check
      - name: Check all remaining historical Golden reviews and source hashes
        run: python -B scripts/audit_golden_remaining.py --check
