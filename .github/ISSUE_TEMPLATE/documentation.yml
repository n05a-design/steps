name: Documentation issue
description: Report missing, incorrect, or outdated STEPS documentation. German and English input are welcome.
title: "Docs: "
labels: ['documentation']
body:
  - type: textarea
    id: location
    attributes:
      label: Document and location
      description: Link the file or section and identify its language.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and suggested correction
      description: Link code, tests, source records, or related issues. Mark uncertain claims as questions.
