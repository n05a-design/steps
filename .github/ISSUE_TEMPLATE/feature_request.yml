name: Feature request
description: Propose a STEPS feature with scope and evidence. Submissions in German or English are welcome.
title: "Feature: "
labels: ['feature']
body:
  - type: textarea
    id: goal
    attributes:
      label: User problem and intended outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies, and evidence
      description: Note affected product, theory, documentation, localization, and release areas where known.
